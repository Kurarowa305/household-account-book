<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Household Book</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main menu">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">¥</div>
          <div>
            <h1>Household Book</h1>
            <p id="activeWalletLabel">Main Wallet</p>
          </div>
        </div>

        <nav class="primary-nav" aria-label="Primary navigation">
          <button class="nav-button is-active" type="button" data-route="home">
            <i data-lucide="layout-dashboard" aria-hidden="true"></i>
            <span>Home</span>
          </button>
          <button class="nav-button" type="button" data-route="portkeys">
            <i data-lucide="table-2" aria-hidden="true"></i>
            <span>Port Keys</span>
          </button>
          <button class="nav-button" type="button" data-route="shopping">
            <i data-lucide="shopping-basket" aria-hidden="true"></i>
            <span>Shopping List</span>
          </button>
          <button class="nav-button" type="button" data-route="reports">
            <i data-lucide="file-chart-column" aria-hidden="true"></i>
            <span>Reports</span>
          </button>
        </nav>

        <button class="wallet-link" type="button" data-route="wallets">
          <i data-lucide="wallet" aria-hidden="true"></i>
          <span>Wallets</span>
        </button>
      </aside>

      <main class="main">
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="app" class="view"></div>
      </main>
    </div>
  </body>
</html>
